name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Detect changed directories
        id: changes
        uses: ./.github/actions/detect-changes

      - name: Install IAC dependencies
        if: steps.changes.outputs.iac_changed == 'true'
        run: |
          cd iac
          bun install --frozen-lockfile

      - name: Install App dependencies
        if: steps.changes.outputs.app_changed == 'true'
        run: |
          cd app
          uv sync

      - name: Run IAC checks
        if: steps.changes.outputs.iac_changed == 'true'
        run: |
          cd iac
          bun run lint
          bun run format:check
          bun run build
          bunx aws-cdk@2.1112.0 synth --context environment=dev

      - name: Run App checks
        if: steps.changes.outputs.app_changed == 'true'
        run: |
          cd app
          uv run ruff check .
          uv run ruff format --check .
