name: CD Pipeline

on:
  push:
    branches: [dev]  # add staging (or prod branch) when ready
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy_dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install IAC dependencies
        run: |
          cd iac
          bun install --frozen-lockfile

      - name: Build IAC
        run: |
          cd iac
          bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: us-west-2

      - name: CDK Deploy to Dev
        run: |
          cd iac
          bunx cdk deploy --all --context environment=dev --require-approval never
        env:
          CDK_DEFAULT_REGION: us-west-2

  deploy_staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install IAC dependencies
        run: |
          cd iac
          bun install --frozen-lockfile

      - name: Build IAC
        run: |
          cd iac
          bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: us-west-2

      - name: CDK Deploy to Staging
        run: |
          cd iac
          bunx cdk deploy --all --context environment=staging --require-approval never
        env:
          CDK_DEFAULT_REGION: us-west-2

  deploy_prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install IAC dependencies
        run: |
          cd iac
          bun install --frozen-lockfile

      - name: Build IAC
        run: |
          cd iac
          bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-west-2

      - name: CDK Deploy to Prod
        run: |
          cd iac
          bunx cdk deploy --all --context environment=prod --require-approval never
        env:
          CDK_DEFAULT_REGION: us-west-2
